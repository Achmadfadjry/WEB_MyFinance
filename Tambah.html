<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Tambah Transaksi - myFinance</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Tambah Transaksi Baru</h1>
        <nav>
            <ul>
                <li><a href="index.html">Kembali ke Dasbor</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <form action="#" method="POST">
            
            <label for="tanggal_transaksi">Tanggal:</label>
            <input type="date" id="tanggal_transaksi" name="tanggal_transaksi"><br><br>

            <label for="kategori">Kategori:</label>
            <select id="kategori" name="kategori">
                <option value="makanan">Makanan</option>
                <option value="transportasi">Transportasi</option>
                <option value="hiburan">Hiburan</option>
            </select><br><br>

            <label for="nominal">Nominal (Rp):</label>
            <input type="number" id="nominal" name="nominal"><br><br>

            <label for="catatan">Catatan Tambahan:</label><br>
            <textarea id="catatan" name="catatan" rows="4" cols="30"></textarea><br><br>

            <button type="submit">Simpan Transaksi</button>
        </form>
    </main>
</body>
</html>
